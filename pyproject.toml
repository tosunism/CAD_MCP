[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cad-mcp"
version = "0.1.0"
description = "An extensible MCP server for AutoCAD automation on Windows."
requires-python = ">=3.11"
dependencies = ["mcp>=1.0.0", "pywin32>=306"]

[project.scripts]
cad-mcp = "cad_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cad_mcp"]
